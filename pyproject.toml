[project]
name = "hologen"
version = "0.2.0"
description = "A library to generate digital holograms."
readme = "README.md"
authors = [
    { name = "Gyokhan Kochmarla", email = "hologen@gyokhan.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.3.5",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scipy>=1.16.3",
    "typer>=0.27.3",
]

[project.scripts]
hologen = "hologen.cli:app"

[build-system]
requires = ["poetry-core>=2,<3"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.8",
]

[tool.ruff.lint]
# Docstrings follow the Google convention (Args, Returns, Raises sections). The
# summary may start on the line after the opening quotes, as most modules do.
# Imports are sorted (I) and lines stay within the formatter's length (E501).
extend-select = ["D", "I", "E501"]
ignore = ["D212"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names describe the test, so test functions need no docstring.
"tests/**" = ["D103"]
# Typer cuts the --help text at a form feed, written \f in the docstrings.
"src/hologen/cli.py" = ["D301"]
