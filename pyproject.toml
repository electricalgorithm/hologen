[project]
name = "hologen"
version = "0.2.0"
description = "A library to generate digital holograms."
readme = "README.md"
authors = [
    { name = "Gyokhan Kochmarla", email = "hologen@gyokhan.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.3.5",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "ruff>=0.14.8",
    "scipy>=1.16.3",
    "typer>=0.27.3",
]

[project.scripts]
hologen = "hologen.cli:app"

[build-system]
requires = ["poetry-core>=2,<3"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
